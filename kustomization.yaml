apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rideshare

resources:
  - namespace.yaml
  - rideshare.yaml
  - load-generator.yaml

# Builds the grafana-cloud-credentials Secret from your local .env file.
# Copy .env.example to .env and fill in your Grafana Cloud values first.
secretGenerator:
  - name: grafana-cloud-credentials
    envs:
      - .env

# Keep a stable Secret name so the Deployments' envFrom references resolve
# without a hash suffix.
generatorOptions:
  disableNameSuffixHash: true
